<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Search — Q3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #resultCount {
      color: #555;
      font-size: 14px;
      margin: 12px 0 0;
    }
    #resultList {
      list-style: none;
      padding: 0;
    }
    #resultList li {
      padding: 8px 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Live Search</h1>
  <input type="text" id="searchInput" placeholder="Search products..." />
  <p id="resultCount"></p>
  <ul id="resultList"></ul>

  <script>
    let items = [];

    const resultList = document.getElementById('resultList');
    const searchInput = document.getElementById('searchInput');
    const resultCount = document.getElementById('resultCount');

    resultCount.textContent = 'Loading data...';

    // Render a list of items using only createElement + textContent.
    function renderList(data) {
      // Clear previous results
      while (resultList.firstChild) {
        resultList.removeChild(resultList.firstChild);
      }

      if (data.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No products found.';
        resultList.appendChild(li);
      } else {
        for (const item of data) {
          const li = document.createElement('li');
          li.textContent =
            item.name + ' — ' + item.category + ' — Rp' + item.price.toLocaleString('id-ID');
          resultList.appendChild(li);
        }
      }

      resultCount.textContent = data.length + ' product(s) found';
    }

    // Load dataset from external JSON file
    fetch('data.json')
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        items = data;
        renderList(items);
      })
      .catch(function () {
        resultCount.textContent = 'Failed to load data.json';
      });

    // Live filter: re-render on every input event
    searchInput.addEventListener('input', function () {
      const keyword = searchInput.value.toLowerCase().trim();

      const filtered = items.filter(function (item) {
        return (
          item.name.toLowerCase().includes(keyword) ||
          item.category.toLowerCase().includes(keyword)
        );
      });

      renderList(filtered);
    });
  </script>
</body>
</html>
