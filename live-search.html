<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Search — Q3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #resultCount {
      color: #555;
      font-size: 14px;
      margin: 12px 0 0;
    }
    #resultList {
      list-style: none;
      padding: 0;
    }
    #resultList li {
      padding: 8px 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Course Live Search</h1>
  <input type="text" id="searchInput" placeholder="Search courses..." />
  <p id="resultCount"></p>
  <ul id="resultList"></ul>

  <script>
    const courses = [
      { code: 'WAD01', title: 'HTML Fundamentals' },
      { code: 'WAD02', title: 'CSS Styling Basics' },
      { code: 'WAD03', title: 'JavaScript Essentials' },
      { code: 'WAD04', title: 'DOM Manipulation' },
      { code: 'WAD05', title: 'Web Security Basics' },
      { code: 'WAD06', title: 'Responsive Web Design' },
      { code: 'WAD07', title: 'Frontend Framework Intro' },
      { code: 'WAD08', title: 'Backend with Node.js' },
      { code: 'WAD09', title: 'Database Fundamentals' },
      { code: 'WAD10', title: 'Deployment and Hosting' }
    ];

    const resultList = document.getElementById('resultList');
    const searchInput = document.getElementById('searchInput');
    const resultCount = document.getElementById('resultCount');

    // Render a list of courses using only createElement + textContent.
    function renderList(data) {
      // Clear previous results
      while (resultList.firstChild) {
        resultList.removeChild(resultList.firstChild);
      }

      if (data.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No courses found.';
        resultList.appendChild(li);
      } else {
        for (const course of data) {
          const li = document.createElement('li');
          li.textContent = course.code + ' — ' + course.title;
          resultList.appendChild(li);
        }
      }

      resultCount.textContent = data.length + ' course(s) found';
    }

    // Initial render: show everything
    renderList(courses);

    // Live filter: re-render on every input event
    searchInput.addEventListener('input', function () {
      const keyword = searchInput.value.toLowerCase().trim();

      const filtered = courses.filter(function (course) {
        return (
          course.title.toLowerCase().includes(keyword) ||
          course.code.toLowerCase().includes(keyword)
        );
      });

      renderList(filtered);
    });
  </script>
</body>
</html>
